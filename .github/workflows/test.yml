name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # A run takes about two minutes; a step that hangs fails it instead of
    # holding it for GitHub's six-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      # core's scenario pages, for tests/core-1.12.test.js
      - run: git clone --depth 1 https://github.com/SureA11y/core.git ../core
      - run: npm test
